name: Generate contribution snake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate mint contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: imranarshad3
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%238DEBD3&color_dots=%23131F28,%231E4A3F,%232C8061,%2345BA8A,%238DEBD3
            dist/snake-light.svg?palette=github-light&color_snake=%231E8D6F&color_dots=%23EBEDF0,%23ACDDCE,%237EC4AB,%2347A985,%231E8D6F

      - name: Publish snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
